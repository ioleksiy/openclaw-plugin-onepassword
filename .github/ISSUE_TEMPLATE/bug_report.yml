name: Bug report
description: Report a problem with the plugin
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! **Never paste real tokens or secret values.** Redact them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error messages (redacted).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it? Include the relevant (redacted) config.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: openclaw-version
    attributes:
      label: OpenClaw version
      placeholder: e.g. 2026.8.2
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Store sync
        - Exec resolver
        - Agent tools
        - Other / not sure
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: e.g. 22.22.3
