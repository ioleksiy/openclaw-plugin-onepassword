name: Release

# Publishes to npm automatically whenever a commit lands on `main` that bumps
# the version to one not yet on npm. Ordinary commits are a no-op (the version
# already exists on npm, so the publish step is skipped). Bump the version with
# `npm run release:prepare -- <x.y.z>` and commit it to trigger a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag and create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read package version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Is this version already on npm?
        id: check
        run: |
          if npm view "openclaw-plugin-onepassword@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "openclaw-plugin-onepassword@${{ steps.v.outputs.version }} is already published — skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "New version ${{ steps.v.outputs.version }} detected — will publish."
          fi

      - name: Verify (typecheck, lint, format, build, test)
        if: steps.check.outputs.publish == 'true'
        run: npm run verify

      - name: Publish to npm (with provenance)
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi
          NOTES="$(awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)"
          [ -n "$NOTES" ] || NOTES="Release v$VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            printf '%s\n' "$NOTES" | gh release edit "v$VERSION" --notes-file -
          else
            printf '%s\n' "$NOTES" | gh release create "v$VERSION" --title "v$VERSION" --notes-file -
          fi
